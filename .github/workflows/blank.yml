name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Scan for secrets
        run: |
          detect-secrets scan > .secrets.baseline
          python -c "
          import json, sys
          with open('.secrets.baseline') as f:
              data = json.load(f)
          results = data.get('results', {})
          if results:
              print('SECRETS FUNDET:')
              for file, secrets in results.items():
                  for secret in secrets:
                      print(f'  {file}: {secret[\"type\"]}')
              sys.exit(1)
          else:
              print('Ingen secrets fundet')
          "

  build-and-test:
    runs-on: ubuntu-latest
    needs: detect-secrets

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd voltedge/charging-session-service
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd voltedge/charging-session-service
          pip install pytest
          pytest app/tests/ -v || echo "Ingen tests endnu"

      - name: Build Docker image
        run: |
          cd voltedge/charging-session-service
          docker build -t voltedge-charging-session-service .
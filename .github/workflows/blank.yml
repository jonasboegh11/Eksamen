name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd voltedge/charging-session-service
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd voltedge/charging-session-service
          pip install pytest
          pytest app/tests/ -v || echo "Ingen tests endnu"

      - name: Build Docker image
        run: |
          cd voltedge/charging-session-service
          docker build -t voltedge-charging-session-service .